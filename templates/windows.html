<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fenster-Monitor</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Inter, sans-serif;
            background: radial-gradient(circle at top, #1f3b2f 0%, #101010 55%, #050505 100%);
            color: #f5f5f5;
            min-height: 100vh;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .panel {
            width: 100%;
            max-width: 1100px;
            background: rgba(20, 20, 20, 0.92);
            border: 1px solid rgba(0, 230, 118, 0.25);
            border-radius: 22px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .subtitle {
            margin: 0 0 24px;
            color: #b8b8b8;
        }

        .grid {
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        }

        .window-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
            border-radius: 18px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 220px;
        }

        .window-card.open {
            border-color: rgba(255, 82, 82, 0.45);
            box-shadow: inset 0 0 0 1px rgba(255, 82, 82, 0.12);
        }

        .window-card.closed {
            border-color: rgba(0, 230, 118, 0.45);
            box-shadow: inset 0 0 0 1px rgba(0, 230, 118, 0.12);
        }

        .window-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .icon {
            font-size: 28px;
        }

        .status-pill {
            border-radius: 999px;
            padding: 7px 12px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .window-card.closed .status-pill {
            background: rgba(0, 230, 118, 0.15);
            color: #8dffb8;
        }

        .window-card.open .status-pill {
            background: rgba(255, 82, 82, 0.15);
            color: #ffb3b3;
        }

        .value {
            font-size: 34px;
            font-weight: 700;
            margin: 8px 0 10px;
        }

        .detail {
            color: #b6b6b6;
            line-height: 1.5;
        }

        .footer {
            margin-top: 16px;
            color: #8e8e8e;
            font-size: 14px;
        }

        .nav {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 16px;
        }

        .nav a {
            color: #00e676;
            text-decoration: none;
            font-weight: 600;
        }

        .nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="nav">
            <a href="/">← Zurück zur Startseite</a>
        </div>
        <h1>🪟 Fenster-Status</h1>
        <p class="subtitle">Schamer mal obs zieht</p>
        <div id="windowsGrid" class="grid"></div>
    </div>

    <script>
        async function loadWindows() {
            const res = await fetch('/api/windows');
            const data = await res.json();
            const grid = document.getElementById('windowsGrid');
            grid.innerHTML = '';

            data.windows.forEach(windowItem => {
                const card = document.createElement('div');
                const isClosed = windowItem.status === 'GESCHLOSSEN';
                card.className = `window-card ${isClosed ? 'closed' : 'open'}`;
                card.innerHTML = `
                    <div class="window-head">
                        <div class="icon">${isClosed ? '🔒' : '🔓'}</div>
                        <div class="status-pill">${windowItem.status}</div>
                    </div>
                    <div class="value">${windowItem.name}</div>
                    <div class="detail">${windowItem.detail}<br>GPIO ${windowItem.gpio}</div>
                `;
                grid.appendChild(card);
            });
        }

        loadWindows();
        setInterval(loadWindows, 1000);
    </script>
</body>
</html>
