<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spielerstatistiken</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px 14px;
            background: #090909;
            color: #f5f5f5;
            font-family: Inter, sans-serif;
        }

        main {
            width: 100%;
            max-width: 860px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.7rem, 5vw, 2.4rem);
        }

        .nav-link {
            padding: 11px 15px;
            border-radius: 12px;
            background: #1d1d1d;
            color: white;
            text-decoration: none;
            white-space: nowrap;
        }

        .panel {
            padding: 22px;
            border: 1px solid #252525;
            border-radius: 18px;
            background: #111;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #c9c9c9;
            font-weight: 700;
        }

        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #333;
            border-radius: 12px;
            background: #1b1b1b;
            color: white;
            font-size: 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .stat-card {
            min-height: 112px;
            padding: 18px;
            border: 1px solid #292929;
            border-radius: 14px;
            background: #191919;
        }

        .stat-label {
            color: #b7b7b7;
            font-size: 0.94rem;
        }

        .stat-value {
            margin-top: 10px;
            color: #00e676;
            font-size: 1.8rem;
            font-weight: 800;
        }

        .empty-state {
            margin: 20px 0 0;
            color: #b7b7b7;
        }

        @media (max-width: 480px) {
            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .panel {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <main>
        <header class="topbar">
            <h1>📊 Spielerstatistiken</h1>
            <a class="nav-link" href="/">← Zur Startseite</a>
        </header>

        <section class="panel">
            <label for="playerSelect">Spieler auswählen</label>
            <select id="playerSelect"></select>
            <div id="statisticsGrid" class="stats-grid"></div>
            <p id="emptyState" class="empty-state" hidden>Es sind noch keine Spieler vorhanden.</p>
        </section>
    </main>

    <script>
        const playerStatistics = {{ player_statistics|tojson }};
        const playerSelect = document.getElementById("playerSelect");
        const statisticsGrid = document.getElementById("statisticsGrid");
        const emptyState = document.getElementById("emptyState");
        const cards = [
            { label: "Gesamter Average", value: player => player.average.toFixed(2) },
            { label: "Average der ersten 9 Pfeile", value: player => player.first9_average.toFixed(2) },
            { label: "180 geworfen", value: player => player.count_180 },
            { label: "Aufnahmen ab 140", value: player => player.count_140_plus },
            { label: "Aufnahmen ab 100", value: player => player.count_100_plus },
            { label: "Legs gespielt", value: player => player.legs_played },
            { label: "Geworfene Pfeile insgesamt", value: player => player.darts_thrown },
            { label: "Punkte insgesamt", value: player => player.score }
        ];

        playerStatistics.forEach((player, index) => {
            const option = document.createElement("option");
            option.value = String(index);
            option.textContent = player.name;
            playerSelect.appendChild(option);
        });

        function renderStatistics() {
            const player = playerStatistics[Number(playerSelect.value)];
            statisticsGrid.replaceChildren();
            emptyState.hidden = Boolean(player);
            playerSelect.disabled = !player;
            if (!player) return;

            cards.forEach(card => {
                const element = document.createElement("article");
                element.className = "stat-card";

                const label = document.createElement("div");
                label.className = "stat-label";
                label.textContent = card.label;

                const value = document.createElement("div");
                value.className = "stat-value";
                value.textContent = card.value(player);

                element.append(label, value);
                statisticsGrid.appendChild(element);
            });
        }

        playerSelect.addEventListener("change", renderStatistics);
        renderStatistics();
    </script>
</body>
</html>
