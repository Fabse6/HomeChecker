<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datei-Ablage (5 Min Safe)</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, sans-serif;
            background: radial-gradient(circle at top, #101520 0%, #05070a 80%);
            color: #f5f5f5;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 600px; }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .topbar h1 { margin: 0; font-size: 1.8rem; }
        .topbar button {
            background: #00e676;
            color: #070707;
            border: none;
            border-radius: 12px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: 700;
        }
        .drop-zone {
            border: 2px dashed rgba(0, 230, 118, 0.4);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            background: rgba(0, 230, 118, 0.03);
            cursor: pointer;
            margin-bottom: 24px;
            transition: background 0.2s, border-color 0.2s;
        }
        .drop-zone:hover, .drop-zone.dragover {
            background: rgba(0, 230, 118, 0.1);
            border-color: #00e676;
        }
        .drop-zone input { display: none; }
        .file-list { display: grid; gap: 12px; }
        .file-card {
            background: #12161f;
            border: 1px solid #222938;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .file-info { display: grid; gap: 4px; }
        .file-name { font-weight: 700; word-break: break-all; }
        .file-meta { font-size: 0.85rem; color: #8899a6; }
        .timer { color: #ffab00; font-weight: 600; }
        .download-btn {
            background: #00e676;
            color: #000;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .empty-state {
            text-align: center;
            color: #667788;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <h1>📁 Quick Drop</h1>
            <button onclick="window.location.href='/'">Zurück</button>
        </div>

        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <div>📤 <strong>Datei hierher ziehen</strong> oder klicken</div>
            <div style="font-size: 0.85rem; color: #8899a6; margin-top: 6px;">Dateien werden nach 5 Minuten automatisch gelöscht</div>
            <input type="file" id="fileInput" onchange="uploadFile(this.files[0])">
        </div>

        <h2>Verfügbare Dateien</h2>
        <div class="file-list" id="fileList">
            <div class="empty-state">Lade Dateien...</div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
        });

        async function uploadFile(file) {
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);

            try {
                await fetch('/api/files/upload', { method: 'POST', body: formData });
                loadFiles();
            } catch (err) {
                alert('Upload fehlgeschlagen');
            }
        }

        async function loadFiles() {
            const res = await fetch('/api/files');
            const data = await res.json();
            const list = document.getElementById('fileList');

            if (data.files.length === 0) {
                list.innerHTML = '<div class="empty-state">Keine aktiven Dateien vorhanden</div>';
                return;
            }

            list.innerHTML = data.files.map(f => {
                const min = Math.floor(f.remaining_seconds / 60);
                const sec = f.remaining_seconds % 60;
                const timeStr = `${min}:${sec < 10 ? '0' : ''}${sec}`;
                return `
                    <div class="file-card">
                        <div class="file-info">
                            <div class="file-name">${f.filename}</div>
                            <div class="file-meta">${f.size_mb} MB • Löschung in <span class="timer">${timeStr}</span></div>
                        </div>
                        <a href="/api/files/download/${encodeURIComponent(f.filename)}" class="download-btn" download>Download</a>
                    </div>
                `;
            }).join('');
        }

        setInterval(loadFiles, 1000);
        loadFiles();
    </script>
</body>
</html>
